name: Production backup checkpoint

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Encrypted production database and product-images checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
      SUPABASE_DB_POOLER_HOST: ${{ secrets.PRODUCTION_SUPABASE_DB_POOLER_HOST }}
      SUPABASE_DB_POOLER_PORT: ${{ secrets.PRODUCTION_SUPABASE_DB_POOLER_PORT }}
      SUPABASE_STORAGE_S3_ENDPOINT: ${{ secrets.PRODUCTION_SUPABASE_STORAGE_S3_ENDPOINT }}
      SUPABASE_STORAGE_S3_REGION: ${{ secrets.PRODUCTION_SUPABASE_STORAGE_S3_REGION }}
      SUPABASE_STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.PRODUCTION_SUPABASE_STORAGE_S3_ACCESS_KEY_ID }}
      SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.PRODUCTION_SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY }}
      BACKUP_VPS_HOST: ${{ secrets.PRODUCTION_BACKUP_VPS_HOST }}
      BACKUP_VPS_PORT: ${{ secrets.PRODUCTION_BACKUP_VPS_PORT }}
      BACKUP_VPS_USER: ${{ secrets.PRODUCTION_BACKUP_VPS_USER }}
      BACKUP_VPS_PATH: ${{ secrets.PRODUCTION_BACKUP_VPS_PATH }}
      BACKUP_VPS_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_BACKUP_VPS_SSH_PRIVATE_KEY }}
      BACKUP_VPS_KNOWN_HOSTS: ${{ secrets.PRODUCTION_BACKUP_VPS_KNOWN_HOSTS }}
      BACKUP_AGE_RECIPIENT: ${{ secrets.PRODUCTION_BACKUP_AGE_RECIPIENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Install backup clients
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age rclone rsync

      - name: Create encrypted production checkpoint
        run: bash scripts/backup/run-production-backup.sh
